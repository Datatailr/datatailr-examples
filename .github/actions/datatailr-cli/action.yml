name: "Setup Datatailr CLI"
description: >-
  Install the datatailr package, configure the remote `dt` CLI, and log in to a
  Datatailr installation non-interactively using credentials passed as inputs.

inputs:
  base-url:
    description: "Datatailr base URL (e.g. https://my-company.datatailr.com)."
    required: true
  username:
    description: "Datatailr username."
    required: true
  password:
    description: "Datatailr password."
    required: true
  python-version:
    description: "Python version used to install and run the CLI."
    required: false
    default: "3.12"
  datatailr-version:
    description: "datatailr package version to install. Leave empty to install the latest release."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install datatailr and log in
      shell: bash
      env:
        # The remote CLI performs a non-interactive login when all three of these
        # environment variables are set (see datatailr._remote_client.utils.interactive_login).
        DATATAILR_BASE_URL: ${{ inputs.base-url }}
        DATATAILR_USER_NAME: ${{ inputs.username }}
        DATATAILR_USER_PASSWORD: ${{ inputs.password }}
        DATATAILR_VERSION: ${{ inputs.datatailr-version }}
      run: |
        set -euo pipefail

        if [ -n "${DATATAILR_VERSION}" ]; then
          python -m pip install --upgrade "datatailr==${DATATAILR_VERSION}"
        else
          python -m pip install --upgrade datatailr
        fi

        # Non-interactive login: reads DATATAILR_BASE_URL / DATATAILR_USER_NAME /
        # DATATAILR_USER_PASSWORD and writes the session to ~/.dt/remote_client.
        datatailr login

        # Install the `dt` shim onto PATH so later steps can call `dt ...`.
        # ensure_login inside setup-cli is a no-op because we already logged in above.
        datatailr setup-cli
