# Promotion manifest (GitOps).
#
# This file is the source of truth for which job versions live in `pre` and
# `prod`. Promotions happen through PULL REQUESTS:
#
#   1. Deploy to `dev` first (Actions -> "Deploy to dev"); note the job name and
#      the version number it produced (`dt job versions "<job>" -e dev`).
#   2. In a branch, edit this file to set the desired version for that job under
#      `pre` (and later under `prod`).
#   3. Open a PR. The "Promote (GitOps)" check posts the exact promotion plan.
#   4. Get the PR reviewed and merged. On merge to `main`, the changed versions
#      are promoted automatically (with environment approval gates).
#
# Promotion chain: dev -> pre -> prod.
#   * A version can only be placed in `pre` if it already exists in `dev`.
#   * A version can only be placed in `prod` if it already exists in `pre`.
#
# Keys are job names EXACTLY as reported by `dt job versions`.
# Values are integer version numbers.
#
# Only ADDED or CHANGED entries are promoted on merge. Removing an entry does
# NOT demote a job (there is no automatic rollback).

pre: {}
  # "Price Server": 3
  # "Price Processor": 3

prod: {}
  # "Price Server": 2
